apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Small resource profile - suitable for development/testing environments
# All containers get: 50m CPU request, 32Mi memory request

patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
  target:
    kind: Deployment
